<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Link report · Void Links</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/brand/quasar-192.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&family=Michroma&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #f5f5f7;
      --muted: rgba(245,245,247,.66);
      --dim: rgba(245,245,247,.42);
      --line: rgba(255,255,255,.1);
      --panel: rgba(14,14,17,.86);
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #000; color: var(--text); font-family: 'Geist', -apple-system, 'Segoe UI', sans-serif; }
    body { min-height: 100vh; background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(80,90,140,.22), transparent 70%), #000; }
    a { color: inherit; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 22px 16px 60px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 34px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: 'Michroma', sans-serif; font-size: .82rem; letter-spacing: .06em; }
    .brand i { width: 30px; height: 30px; border-radius: 50%; background: #000 url("assets/brand/quasar-64.png") center / cover; box-shadow: 0 0 0 1px rgba(255,255,255,.18); }
    .pill { font-size: .75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; }
    h1 { font-size: clamp(1.7rem, 5vw, 2.6rem); letter-spacing: -.035em; margin: 0 0 8px; font-weight: 800; word-break: break-all; }
    .sub { color: var(--muted); margin: 0 0 26px; line-height: 1.6; }
    .sub b { color: var(--text); font-weight: 600; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(4, 1fr); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
    .kpi small, .panel h2 { display: block; font-size: .78rem; color: var(--dim); font-weight: 500; margin: 0 0 8px; text-transform: none; letter-spacing: 0; }
    .kpi b { font-size: 1.9rem; letter-spacing: -.03em; }
    .wide { grid-column: 1 / -1; }
    .half { grid-column: span 2; }
    .bars { display: flex; align-items: flex-end; gap: 3px; height: 150px; }
    .bars i { flex: 1; min-width: 2px; border-radius: 3px 3px 1px 1px; background: linear-gradient(180deg, #fff, rgba(255,255,255,.35)); position: relative; }
    .bars i.zero { background: rgba(255,255,255,.07); height: 3px !important; }
    .bars i:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: .72rem; background: #fff; color: #000; padding: 4px 7px; border-radius: 6px; z-index: 2; }
    .axis { display: flex; justify-content: space-between; color: var(--dim); font-size: .72rem; margin-top: 8px; }
    .rows { display: grid; gap: 10px; }
    .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: .9rem; }
    .row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row b { font-weight: 600; font-variant-numeric: tabular-nums; }
    .row em { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
    .row em::after { content: ''; display: block; height: 100%; width: var(--w); border-radius: 3px; background: linear-gradient(90deg, rgba(255,255,255,.45), #fff); }
    .empty { color: var(--dim); font-size: .9rem; }
    .note { color: var(--dim); font-size: .78rem; margin-top: 22px; line-height: 1.6; }
    .state { text-align: center; padding: 90px 10px; }
    .state h1 { font-size: 1.6rem; }
    .btn { display: inline-block; margin-top: 14px; background: #fff; color: #000; text-decoration: none; font-weight: 600; padding: 11px 18px; border-radius: 999px; }
    footer { text-align: center; color: var(--dim); font-size: .8rem; margin-top: 34px; }
    footer a { color: var(--muted); }
    @media (max-width: 760px) { .grid { grid-template-columns: repeat(2, 1fr); } .half { grid-column: 1 / -1; } .bars { height: 110px; gap: 2px; } }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/"><i aria-hidden="true"></i>VOID LINKS</a>
    <span class="pill">Shared link report</span>
  </header>
  <main id="out"><div class="state"><p class="sub">Loading report…</p></div></main>
  <footer>Made with <a href="/">Void Links</a> · Short links with live click stats</footer>
</div>
<script src="supabase-config.js"></script>
<script>
// A different report pasted into the same tab: load it
window.addEventListener('hashchange', () => location.reload());
(function () {
  const cfg = window.SUPABASE_CONFIG;
  const out = document.getElementById('out');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => Number(n || 0).toLocaleString();
  const token = (location.hash.slice(1) || new URLSearchParams(location.search).get('t') || '').trim();

  function state(title, text) {
    out.innerHTML = `<div class="state"><h1>${esc(title)}</h1><p class="sub">${esc(text)}</p><a class="btn" href="/">Go to Void Links</a></div>`;
  }
  if (!/^[a-f0-9]{16,64}$/i.test(token)) { state('Report not found', 'This report address is incomplete. Ask the owner for the full link.'); return; }

  let regionName = null;
  try { regionName = new Intl.DisplayNames(undefined, { type: 'region' }); } catch (_) {}
  const flag = cc => /^[A-Z]{2}$/.test(cc) ? String.fromCodePoint(...[...cc].map(c => 0x1F1A5 + c.charCodeAt(0))) : '🌐';
  const country = cc => cc === '??' ? 'Unknown' : (regionName ? (regionName.of(cc) || cc) : cc);
  const device = d => ({ mobile: 'Phone', desktop: 'Computer', tablet: 'Tablet', bot: 'Bot', other: 'Other' }[d] || (d.charAt(0).toUpperCase() + d.slice(1)));

  function rows(list, label) {
    if (!list.length) return '<p class="empty">No clicks yet</p>';
    const max = Math.max(...list.map(x => x.n));
    return '<div class="rows">' + list.map(x => `<div class="row"><span>${label(x.k)}</span><b>${fmt(x.n)}</b><em style="--w:${(x.n / max * 100).toFixed(1)}%"></em></div>`).join('') + '</div>';
  }
  function bars(series, tip) {
    const max = Math.max(1, ...series.map(x => x.n));
    return '<div class="bars">' + series.map(x => `<i class="${x.n ? '' : 'zero'}" style="height:${(x.n / max * 100).toFixed(1)}%" data-tip="${esc(tip(x))}"></i>`).join('') + '</div>';
  }

  fetch(cfg.url + '/rest/v1/rpc/get_shared_report', {
    method: 'POST',
    headers: { apikey: cfg.key, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_token: token }),
  }).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(d => {
    if (!d) { state('Report not available', 'The owner turned sharing off for this link, or the link was deleted.'); return; }
    // Last 30 days, one bar per day (days without clicks included)
    const byDay = new Map(d.days.map(x => [x.d, x.n]));
    const days = [];
    for (let i = 29; i >= 0; i--) {
      const t = new Date(Date.now() - i * 864e5);
      const key = t.toISOString().slice(0, 10);
      days.push({ d: key, n: byDay.get(key) || 0 });
    }
    const last30 = days.reduce((a, x) => a + x.n, 0);
    const last7 = days.slice(-7).reduce((a, x) => a + x.n, 0);
    const byHour = new Map(d.hours.map(x => [x.h, x.n]));
    const hours = Array.from({ length: 24 }, (_, h) => ({ h, n: byHour.get(h) || 0 }));
    const busiest = hours.reduce((a, b) => (b.n > a.n ? b : a), hours[0]);
    const dayLabel = s => new Date(s + 'T12:00:00Z').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    const short = (cfg.linkUrl || 'https://go.voids.wtf').replace(/^https?:\/\//, '') + '/' + d.slug;
    document.title = short + ' · Link report';

    out.innerHTML = `
      <h1>${esc(short)}</h1>
      <p class="sub">Goes to <b>${esc(d.site)}</b> · created ${esc(new Date(d.created).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }))}</p>
      <div class="grid">
        <div class="panel kpi"><small>All-time clicks</small><b>${fmt(d.total)}</b></div>
        <div class="panel kpi"><small>Last 30 days</small><b>${fmt(last30)}</b></div>
        <div class="panel kpi"><small>Last 7 days</small><b>${fmt(last7)}</b></div>
        <div class="panel kpi"><small>Busiest hour (UTC)</small><b>${busiest.n ? String(busiest.h).padStart(2, '0') + ':00' : '—'}</b></div>
        <div class="panel wide"><h2>Clicks per day, last 30 days</h2>${bars(days, x => `${dayLabel(x.d)}: ${fmt(x.n)}`)}<div class="axis"><span>${esc(dayLabel(days[0].d))}</span><span>Today</span></div></div>
        <div class="panel half"><h2>Countries</h2>${rows(d.countries, k => `${flag(k)} ${esc(country(k))}`)}</div>
        <div class="panel half"><h2>Where clicks come from</h2>${rows(d.referrers, k => esc(k))}</div>
        <div class="panel half"><h2>Devices</h2>${rows(d.devices, k => esc(device(k)))}</div>
        <div class="panel half"><h2>Clicks by hour (UTC)</h2>${bars(hours, x => `${String(x.h).padStart(2, '0')}:00: ${fmt(x.n)}`)}<div class="axis"><span>00:00</span><span>12:00</span><span>23:00</span></div></div>
      </div>
      <p class="note">Shared by the owner of this link. Countries, devices, sources and hours cover the last 90 days. Only totals are shown, never individual visitors.</p>`;
  }).catch(e => { console.error(e); state('Report not available yet', "Couldn't load this report. Try again in a moment."); });
})();
</script>
</body>
</html>
