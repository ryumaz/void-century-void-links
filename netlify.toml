# Netlify settings. The site is plain static files: no build step.
# Security headers live in _headers (shared with Cloudflare Pages).
# Cloudflare Pages ignores this file; there, functions/_middleware.js does the routing.
[build]
  publish = "."

# Short-link redirects run at the edge (netlify/edge-functions/shortlink.ts).
# Real files (index.html, admin.html, assets…) are always served before these rules.

# Staff portal: /admin
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# A missing file under /assets must be a real 404, never the redirect page
# (browsers cache /assets for 7 days, so a wrong answer would stick)
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Everything else goes to go.html: /abc123 → short link, /@name → profile page
[[redirects]]
  from = "/*"
  to = "/go.html"
  status = 200
