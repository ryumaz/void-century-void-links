# Void Links moved to https://voids.wtf (hosted on Cloudflare Pages).
# This keeps the old address working: every voidlinks.netlify.app/... address
# is sent to the same path on voids.wtf, so old short links, profile pages and
# QR codes still open.
[build]
  publish = "."

[[redirects]]
  from = "/*"
  to = "https://voids.wtf/:splat"
  status = 301
  force = true
