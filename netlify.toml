# Netlify settings. The site is plain static files: no build step.
[build]
  publish = "."

# Short-link redirects run at the edge when deployed via Git or the Netlify CLI
# (see netlify/edge-functions/shortlink.ts). Routing for drag-and-drop lives in _redirects.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # Only our own scripts plus the two CDNs we use can run; data only goes to Supabase,
    # Spotify and Lanyard; only Spotify may be embedded. Images may come from any https
    # address (profile photos from Google/GitHub/Discord, Spotify album art).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https://agbsbbkrinewplajdwax.supabase.co; connect-src 'self' data: blob: https://agbsbbkrinewplajdwax.supabase.co wss://agbsbbkrinewplajdwax.supabase.co https://api.lanyard.rest https://accounts.spotify.com https://api.spotify.com https://cdn.jsdelivr.net; frame-src https://open.spotify.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

# Big static files rarely change: let browsers cache them
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex"
